# Required check names (branch protection / ruleset):
#   json-validate
#   secrets-scan
#   home-path-scan
#   plugin-validate
#
# This workflow does not authenticate to Massed Compute MCP and must not
# receive OAuth tokens or API keys.
name: Plugin CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  json-validate:
    name: json-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Validate JSON and plugin structure
        run: python3 scripts/ci_checks.py --only json --only structure

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: Scan for secret-shaped literals
        run: python3 scripts/ci_checks.py --only secrets
      - name: Install verified gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Scan Git history
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            gitleaks git --log-opts="${{ github.event.pull_request.base.sha }}..HEAD" --verbose
          else
            gitleaks git --verbose
          fi

  home-path-scan:
    name: home-path-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Scan for machine-specific home paths
        run: python3 scripts/ci_checks.py --only home-paths

  plugin-validate:
    name: plugin-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Run pack validator (CI-safe; no Claude CLI / no MCP)
        run: ./scripts/validate.sh
